<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Critical inline paint: the app background lives in src/index.css, which is
      bundled with the JS. Painting it here avoids a white flash on first load
      (notably Firefox). Keep the colour in sync with --bg-dark in index.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #2c2c2c;
      }
    </style>
    <!-- One asset per size: browsers then pick a native bitmap instead of
         downscaling a large one, which is what made the 16 px tab icon look soft. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browsers ignore the manifest until the app is installed; the meta tag
         keeps tab/address-bar chrome grey in the meantime. -->
    <meta name="theme-color" content="#2c2c2c" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual"
    />
    <script>
      const viewport = document.querySelector("meta[name=viewport]");
      viewport.setAttribute(
        "content",
        viewport.content + ", height=" + window.innerHeight,
      );
    </script>
    <title>Plat de la Semaine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
