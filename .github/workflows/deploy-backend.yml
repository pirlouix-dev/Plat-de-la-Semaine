name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref to build and deploy (branch, tag, or SHA). Defaults to the
          selected ref. Use this to redeploy a tag that predates this workflow.
        required: false
        default: ''

# Two deploys must never interleave; queue the second one instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    outputs:
      commit: ${{ steps.revision.outputs.commit }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve the commit being deployed
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore plat-de-la-semaine-back.slnx

      - name: Build
        run: >-
          dotnet build plat-de-la-semaine-back.slnx
          --configuration Release --no-restore
          -p:SourceRevisionId=${{ steps.revision.outputs.commit }}

      - name: Test
        run: >-
          dotnet test tests/PlatDeLaSemaineBack.Tests/PlatDeLaSemaineBack.Tests.csproj
          --configuration Release --no-build --verbosity normal

      - name: Publish
        run: >-
          dotnet publish plat-de-la-semaine-back.csproj
          --configuration Release --no-build --output ${{ runner.temp }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # An environment subject is ref-independent, so a dispatch on any branch or
    # tag can authenticate. See docs/azure-deploy.md.
    environment: Production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: PDLS
          slot-name: Production
          package: .

      - name: Verify the deployed build
        shell: bash
        env:
          APP_URL: ${{ secrets.PROD_SERVER_URL }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::The PROD_SERVER_URL secret is not set."
            exit 1
          fi

          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            live="$(curl -fsS --max-time 10 "$APP_URL/api/ping" 2>/dev/null \
              | jq -r '.commit // empty' || true)"
            if [ "$live" = "$EXPECTED_COMMIT" ]; then
              echo "The live backend serves commit $live."
              exit 0
            fi
            echo "Waiting for commit $EXPECTED_COMMIT (live: ${live:-unreachable})."
            sleep 5
          done

          echo "::error::The live backend never reported commit $EXPECTED_COMMIT."
          exit 1
