version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 6
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Keep package.json's minimums untouched while the new release still
    # satisfies them, so grouped PRs only move the lockfile.
    versioning-strategy: "increase-if-necessary"
    ignore:
      # Majors track Node majors, and .nvmrc pins the runtime to Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      frontend-prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Ship with the SDK: a major only makes sense with a TargetFramework bump,
      # and Microsoft.OpenApi majors are coupled to Microsoft.AspNetCore.OpenApi.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/backend/tests/PlatDeLaSemaineBack.Tests"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]
    groups:
      backend-tests-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "chore"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
