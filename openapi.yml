  /api/version:
    get:
      tags:
      - Settings
      summary: Fetch the latest version information
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/VersionInfo'
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
        '503':
          description: Service Unavailable
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDetail'
components:
  schemas:
    AccountDeletionResponse:
      type: object
      properties:
        message:
          type: string
    ApiErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    ApiFieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue: {}
    AuthResponse:
      required:
      - idToken
      - refreshToken
      - expiresIn
      - userId
      - username
      type: object
      properties:
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
        userId:
          type: string
        username:
          type: string
    BackupListResponse:
      required:
      - data
      - total
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BackupSummary'
        total:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
    BackupRestoreResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RestoreBackupResponse'
    BackupSummary:
      required:
      - id
      - createdAt
      - dishCount
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        dishCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
    BuildInfo:
      required:
      - commit
      type: object
      properties:
        commit:
          type: string
    CreateDishPayload:
      required:
      - name
      - course
      - seasons
      type: object
      properties:
        id:
          type:
          - 'null'
          - string
        name:
          maxLength: 200
          minLength: 0
          type: string
        description:
          maxLength: 5000
          minLength: 0
          type: string
        course:
          maximum: 2
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        seasons:
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
            - integer
            - string
            format: int32
    Dish:
      required:
      - id
      - userId
      type: object
      properties:
        id:
          type:
          - 'null'
          - string
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        course:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        seasons:
          type: array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
            - integer
            - string
            format: int32
        updatedAt:
          type: string
          format: date-time
        isDeleted:
          type: boolean
    DishBatchOperation:
      type: object
      properties:
        op:
          type:
          - 'null'
          - string
        id:
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
        description:
          type:
          - 'null'
          - string
        course:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        seasons:
          type:
          - 'null'
          - array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
            - integer
            - string
            format: int32
    DishBatchOperationResult:
      required:
      - index
      - status
      type: object
      properties:
        index:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        op:
          type:
          - 'null'
          - string
        status:
          type: string
        id:
          type:
          - 'null'
          - string
        data:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Dish'
        code:
          type:
          - 'null'
          - string
        message:
          type:
          - 'null'
          - string
        errors:
          type:
          - 'null'
          - array
          items:
            $ref: '#/components/schemas/ApiFieldError'
    DishBatchPayload:
      required:
      - operations
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/DishBatchOperation'
    DishBatchResponse:
      required:
      - created
      - updated
      - deleted
      - failed
      - results
      type: object
      properties:
        created:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        updated:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        deleted:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        failed:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        results:
          type: array
          items:
            $ref: '#/components/schemas/DishBatchOperationResult'
    DishListResponse:
      required:
      - data
      - total
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Dish'
        total:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
    DishSingleResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Dish'
    FeedbackPayload:
      required:
      - message
      - appVersion
      type: object
      properties:
        message:
          maxLength: 2000
          minLength: 0
          type: string
        appVersion:
          type: string
    ForgotPasswordPayload:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    LoginPayload:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    Menu:
      type: object
      properties:
        selectedDishIds:
          type: array
          items:
            type: string
        updatedAt:
          type:
          - 'null'
          - string
          format: date-time
    MenuResponse:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Menu'
    RefreshPayload:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      required:
      - idToken
      - refreshToken
      - expiresIn
      type: object
      properties:
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
    RegisterPayload:
      required:
      - email
      - password
      - username
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        username:
          maxLength: 100
          minLength: 1
          type: string
    RestoreBackupResponse:
      required:
      - backupId
      - restoredCount
      - safetyBackupCreatedAt
      type: object
      properties:
        backupId:
          type: string
        restoredCount:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int32
        safetyBackupCreatedAt:
          type: string
          format: date-time
    SaveMenuPayload:
      required:
      - selectedDishIds
      - expectedUpdatedAt
      type: object
      properties:
        selectedDishIds:
          type: array
          items:
            type: string
        expectedUpdatedAt:
          type:
          - 'null'
          - string
          format: date-time
    UpdateDishPayload:
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 0
          type:
          - 'null'
          - string
        description:
          maxLength: 5000
          minLength: 0
          type:
          - 'null'
          - string
        course:
          maximum: 2
          minimum: 0
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int32
        seasons:
          type:
          - 'null'
          - array
          items:
            pattern: ^-?(?:0|[1-9]\d*)$
            type:
            - integer
            - string
            format: int32
    UpdateUsernamePayload:
      required:
      - username
      type: object
      properties:
        username:
          maxLength: 100
          minLength: 1
          type: string
    VersionInfo:
      required:
      - latestVersion
      type: object
      properties:
        latestVersion:
          type: string
tags:
- name: Auth
- name: Backups
- name: Dishes
- name: Settings
- name: Menu
- name: Health
